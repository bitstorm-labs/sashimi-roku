name: Bug report
description: Something in the channel misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Movies library
        2. Press * during playback
        3. ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Roku model and OS version
      description: Settings → System → About
      placeholder: Roku Ultra 4800X, Roku OS 14.5
    validations:
      required: true
  - type: input
    id: channel
    attributes:
      label: Sashimi version
      description: Shown at the bottom of the sidebar
      placeholder: v1.1.24
    validations:
      required: true
  - type: input
    id: jellyfin
    attributes:
      label: Jellyfin server version
      placeholder: 10.11.11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug console output
      description: >
        If you can sideload, `nc <roku-ip> 8085` captures the debug console.
        Please redact your server URL and any tokens.
      render: shell
